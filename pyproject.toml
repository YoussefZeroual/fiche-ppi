[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fiche-ppi"
version = "0.1.3"
description = "Generate PPI sheets from Excel templates"
readme = "README.md"
authors = [{name = "Youssef ZEROUAL", email = "youssef.zeroual87@gmail.com"}]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.24.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
    "xlrd"
]

[project.scripts]
fiche-ppi-gui = "fiche_ppi.gui:main"
fiche-ppi = "fiche_ppi.fiche_ppi:main"

[project.urls]
Homepage = "https://github.com/yourusername/fiche-ppi"
