[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fiche-ppi"
version = "0.1.0"
description = "Generate PPI sheets from Excel templates"
readme = "README.md"
authors = [{name = "Your Name", email = "you@example.com"}]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.24.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
fiche-ppi-gui = "fiche_ppi.gui:main"

[project.urls]
Homepage = "https://github.com/yourusername/fiche-ppi"
Bug-tracker = "https://github.com/yourusername/fiche-ppi/issues"
